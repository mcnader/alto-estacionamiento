<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Comprobantes El Andamio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
  body{background:#f5f4f0;padding:16px;max-width:520px;margin:0 auto}
  h1{font-size:18px;margin-bottom:16px}
  .card{background:#fff;border:1px solid #e0dfd8;border-radius:12px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:11px;font-weight:600;color:#666;margin-bottom:4px;text-transform:uppercase}
  input{width:100%;padding:10px;border:1px solid #e0dfd8;border-radius:8px;font-size:15px;margin-bottom:12px}
  button{width:100%;padding:12px;border:none;border-radius:8px;background:#1a1a18;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .btn-sm{width:auto;padding:6px 12px;font-size:12px}
  .btn-sec{background:#fff;color:#1a1a18;border:1px solid #e0dfd8;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;color:#999;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid #eee}
  td{padding:8px 4px;border-bottom:1px solid #f5f4f0;vertical-align:middle}
  .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .b-gy{background:#f0f0f0;color:#555}
  .b-gr{background:#e8f5ee;color:#1a6b3c}
  .b-rd{background:#fdeaea;color:#8b2020}
  .b-am{background:#fef3db;color:#7a4f00}
  .icon-btn{background:none;border:none;font-size:15px;cursor:pointer;padding:0 4px;width:auto}
  #clave-box{text-align:center;margin-top:60px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tot{background:#f5f4f0;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px}
  .tot div{display:flex;justify-content:space-between;margin-bottom:3px}

  #print-area{display:none}
  @media print{
    body>*:not(#print-area){display:none!important}
    #print-area{
      display:block!important;
      font-family:monospace;
      font-size:9pt;
      width:100%;
      padding:0 2mm;
    }
    @page{ size: 80mm auto; margin: 2mm 0; }
    .p-logo{font-size:11pt;font-weight:700;border-bottom:1px dashed #000;padding-bottom:4pt;margin-bottom:6pt;text-align:center}
    .p-sub{font-size:8pt;text-align:center;margin-bottom:6pt}
    .p-linea{display:flex;justify-content:space-between;margin-bottom:3pt}
    .p-sep{border-top:1px dashed #000;margin:6pt 0}
    .p-item{margin-bottom:5pt;padding-bottom:5pt;border-bottom:1px dotted #ccc}
    .p-item .fila1{display:flex;justify-content:space-between;font-weight:700}
    .p-item .fila2{font-size:8pt;color:#333}
    .p-total{font-size:11pt;font-weight:700;display:flex;justify-content:space-between;margin-top:6pt}
  }
</style>
</head>
<body>

<div id="clave-box">
  <h1>Comprobantes El Andamio</h1>
  <div class="card">
    <label>Clave de acceso</label>
    <input type="password" id="clave-input" placeholder="Clave">
    <button onclick="entrar()">Entrar</button>
  </div>
</div>

<div id="app" style="display:none">
  <h1>Comprobantes El Andamio <span style="font-size:11px;color:#999;font-weight:400">(uso urgente)</span></h1>

  <div class="card">
    <label>Importe transferido</label>
    <input type="number" id="monto" placeholder="0">
    <label>N° operación completo, o solo los últimos 4 dígitos</label>
    <input type="text" id="nro" placeholder="Ej: 5807 o 169300365807">
    <label>Patente (opcional)</label>
    <input type="text" id="patente" placeholder="Ej: AB123CD" style="text-transform:uppercase">
    <button id="btn-cargar" onclick="cargar()">Cargar comprobante</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong style="font-size:12px;color:#999;text-transform:uppercase">Últimos comprobantes</strong>
      <button class="btn-sm" onclick="listar()">↻ Actualizar</button>
    </div>
    <table>
      <thead><tr><th>Fecha/Hora</th><th>Importe</th><th>Patente</th><th>Estado</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="card">
    <strong style="font-size:12px;color:#999;text-transform:uppercase;display:block;margin-bottom:10px">Informe para caja (por turno)</strong>
    <div class="row2">
      <div><label>Desde</label><input type="datetime-local" id="rep-desde"></div>
      <div><label>Hasta</label><input type="datetime-local" id="rep-hasta"></div>
    </div>
    <button onclick="generarInforme()">Generar informe</button>
    <button class="btn-sec" id="btn-imprimir" style="display:none" onclick="window.print()">🖨️ Imprimir informe (rollo 80mm)</button>
    <div id="rep-cont" style="margin-top:14px"></div>
  </div>
</div>

<div id="print-area"></div>

<script>
let CLAVE = localStorage.getItem('andamio_clave') || '';

function entrar(){
  CLAVE = document.getElementById('clave-input').value.trim();
  localStorage.setItem('andamio_clave', CLAVE);
  mostrarApp();
}

async function api(method, path, body){
  const opts = { method, headers: { 'Content-Type':'application/json', 'x-clave': CLAVE } };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if(r.status === 401 && !body?.claveConfirmacion){ alert('Clave incorrecta'); localStorage.removeItem('andamio_clave'); location.reload(); return; }
  return r.json();
}

async function mostrarApp(){
  document.getElementById('clave-box').style.display='none';
  document.getElementById('app').style.display='block';

  const ahora = new Date();
  const inicioHoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate(), 0, 0);
  document.getElementById('rep-desde').value = toLocalInputValue(inicioHoy);
  document.getElementById('rep-hasta').value = toLocalInputValue(ahora);

  await listar();
}

function toLocalInputValue(date){
  const pad = n => String(n).padStart(2,'0');
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

async function cargar(){
  const monto = parseFloat(document.getElementById('monto').value) || 0;
  const nro = document.getElementById('nro').value.trim();
  const patente = document.getElementById('patente').value.trim();
  if(!monto){ alert('Ingresá el importe'); return; }
  const btn = document.getElementById('btn-cargar');
  btn.disabled = true; btn.textContent = 'Verificando...';
  await api('POST','/andamio-urgente/comprobantes', { monto, nro_operacion: nro || null, patente: patente || null });
  btn.disabled = false; btn.textContent = 'Cargar comprobante';
  document.getElementById('monto').value='';
  document.getElementById('nro').value='';
  document.getElementById('patente').value='';
  await listar();
}

async function borrar(id){
  const clave = prompt('Para borrar, ingresá la clave de acceso de nuevo:');
  if(clave === null) return;
  const r = await api('DELETE', '/andamio-urgente/comprobantes/'+id, { claveConfirmacion: clave });
  if(r && r.error){ alert(r.error); return; }
  await listar();
}

async function reintentar(id){
  await api('POST', '/andamio-urgente/comprobantes/'+id+'/reintentar');
  await listar();
}

const badges = {
  pendiente: '<span class="badge b-gy">Pendiente</span>',
  verificado: '<span class="badge b-gr">✓ Verificado</span>',
  sin_matchear: '<span class="badge b-rd">⚠ Sin matchear</span>',
  revisar_manual: '<span class="badge b-am">Revisar manual</span>',
};

const estadoCorto = {
  pendiente: 'Pendiente',
  verificado: 'OK',
  sin_matchear: 'SIN MATCH',
  revisar_manual: 'REVISAR',
};

async function listar(){
  const lista = await api('GET','/andamio-urgente/comprobantes');
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = (lista||[]).map(c => {
    const puedeReintentar = c.estado === 'sin_matchear' || c.estado === 'revisar_manual';
    const fechaHora = new Date(c.fecha_hora).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<tr>
      <td>${fechaHora}</td>
      <td>$${Math.round(c.monto).toLocaleString('es-AR')}</td>
      <td>${c.patente||'—'}</td>
      <td>${badges[c.estado]||c.estado}</td>
      <td style="white-space:nowrap">
        ${puedeReintentar ? `<button class="icon-btn" onclick="reintentar(${c.id})" title="Reintentar">🔄</button>` : ''}
        <button class="icon-btn" onclick="borrar(${c.id})" title="Borrar">🗑️</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5">Sin comprobantes</td></tr>';
}

async function generarInforme(){
  const desdeInput = document.getElementById('rep-desde').value;
  const hastaInput = document.getElementById('rep-hasta').value;
  if(!desdeInput || !hastaInput){ alert('Completá ambas fechas'); return; }

  const desde = new Date(desdeInput).toISOString();
  const hasta = new Date(hastaInput).toISOString();

  const data = await api('GET', `/andamio-urgente/reporte?desde=${encodeURIComponent(desde)}&hasta=${encodeURIComponent(hasta)}`);
  if(!data || data.error){ alert(data?.error||'Error'); return; }
  const t = data.totales;
  const fmt = s => new Date(s).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const fechasTexto = `${fmt(desde)} — ${fmt(hasta)}`;

  const filasPantalla = data.comprobantes.map(c => `<tr>
    <td>${new Date(c.fecha_hora).toLocaleDateString('es-AR')} ${new Date(c.fecha_hora).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</td>
    <td>$${Math.round(c.monto).toLocaleString('es-AR')}</td>
    <td>${c.patente||'—'}</td>
    <td>${c.nro_operacion||'—'}</td>
    <td>${badges[c.estado]||c.estado}</td>
  </tr>`).join('');

  document.getElementById('rep-cont').innerHTML = `
    <div class="tot">
      <div><span>Total comprobantes</span><strong>${t.cantidad}</strong></div>
      <div><span>Monto total cargado</span><strong>$${Math.round(t.total).toLocaleString('es-AR')}</strong></div>
      <div style="color:#1a6b3c"><span>Verificados (${t.verificados})</span><strong>$${Math.round(t.totalVerificado).toLocaleString('es-AR')}</strong></div>
      <div style="color:#8b2020"><span>Sin matchear</span><strong>${t.sinMatchear}</strong></div>
      <div style="color:#7a4f00"><span>A revisar manual</span><strong>${t.revisarManual}</strong></div>
      <div style="color:#555"><span>Pendientes</span><strong>${t.pendientes}</strong></div>
    </div>
    <table>
      <thead><tr><th>Fecha/Hora</th><th>Importe</th><th>Patente</th><th>N° Op</th><th>Estado</th></tr></thead>
      <tbody>${filasPantalla || '<tr><td colspan="5">Sin comprobantes en ese rango</td></tr>'}</tbody>
    </table>
  `;

  const itemsTicket = data.comprobantes.map(c => `
    <div class="p-item">
      <div class="fila1"><span>${new Date(c.fecha_hora).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</span><span>$${Math.round(c.monto).toLocaleString('es-AR')}</span></div>
      <div class="fila2">${c.patente ? 'Pat: '+c.patente+' · ' : ''}${estadoCorto[c.estado]||c.estado}${c.nro_operacion ? ' · N° '+c.nro_operacion : ''}</div>
    </div>
  `).join('') || '<div>Sin comprobantes en ese rango</div>';

  document.getElementById('print-area').innerHTML = `
    <div class="p-logo">EL ANDAMIO</div>
    <div class="p-sub">${fechasTexto}</div>
    <div class="p-sep"></div>
    ${itemsTicket}
    <div class="p-sep"></div>
    <div class="p-linea"><span>Cantidad</span><span>${t.cantidad}</span></div>
    <div class="p-linea"><span>Verificados</span><span>${t.verificados}</span></div>
    <div class="p-linea"><span>Sin matchear</span><span>${t.sinMatchear}</span></div>
    <div class="p-linea"><span>A revisar</span><span>${t.revisarManual}</span></div>
    <div class="p-sep"></div>
    <div class="p-total"><span>TOTAL VERIF.</span><span>$${Math.round(t.totalVerificado).toLocaleString('es-AR')}</span></div>
    <div class="p-total"><span>TOTAL CARGADO</span><span>$${Math.round(t.total).toLocaleString('es-AR')}</span></div>
  `;

  document.getElementById('btn-imprimir').style.display = 'block';
}

if(CLAVE) mostrarApp();
</script>
</body>
</html>
